# Render Blueprint for the OnePlace API (free tier).
# Render dashboard -> New -> Blueprint -> pick this repo.
# Variables marked `sync: false` are prompted for on first setup; never commit their values.
services:
  - type: web
    name: oneplace-api
    runtime: node
    plan: free
    region: virginia # closest to the Neon database (us-east-1)
    rootDir: backend
    # Free instances have no pre-deploy step, so migrations run at the end of the build.
    # --include=dev: NODE_ENV=production makes npm skip devDependencies (typescript, @types/*) needed to build.
    buildCommand: npm ci --include=dev && npm run build && npm run migrate:deploy
    startCommand: npm start
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: https://oneplace-c1b.pages.dev
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DATABASE_URL
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_CDN_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: HF_API_KEY
        sync: false
      - key: DAILY_API_KEY
        sync: false
